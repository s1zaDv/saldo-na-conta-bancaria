<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Saldo</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        background: #0b1120;
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 400px;
      }

      .card {
        background: #151f30;
        border: 1px solid #263348;
        border-radius: 24px;
        padding: 30px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      }

      .topo {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 32px;
      }

      .icone {
        width: 48px;
        height: 48px;
        border-radius: 15px;
        background: #183b32;
        color: #4ade80;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
      }

      .topo h1 {
        font-size: 20px;
      }

      .topo p {
        color: #94a3b8;
        font-size: 13px;
        margin-top: 5px;
      }

      .saldo-card {
        background: linear-gradient(135deg, #164e3c, #166534);
        padding: 24px 20px;
        border-radius: 18px;
        margin-bottom: 24px;
      }

      .saldo-label {
        font-size: 14px;
        color: #bbf7d0;
        margin-bottom: 14px;
      }

      .valor {
        font-size: clamp(25px, 7vw, 32px);
        font-weight: bold;
        letter-spacing: -1px;
      }

      .status {
        display: inline-block;
        margin-top: 18px;
        padding: 7px 10px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        font-size: 12px;
        color: #dcfce7;
      }

      .mensagem {
        color: #cbd5e1;
        font-size: 14px;
        line-height: 1.7;
        text-align: center;
        padding: 0 4px;
      }

      .rodape {
        text-align: center;
        color: #64748b;
        font-size: 12px;
        margin-top: 28px;
      }

      @media (max-width: 400px) {
        .card {
          padding: 22px;
        }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <section class="card">
        <header class="topo">
          <div class="icone">↗</div>
          <div>
            <h1>Minha Conta</h1>
            <p>Seu dinheiro, sob controle.</p>
          </div>
        </header>

        <div class="saldo-card">
          <p class="saldo-label">Saldo disponível</p>
          <p class="valor">R$ 2.353,42</p>
          <span class="status">● Conta ativa</span>
        </div>

        <p class="mensagem">
          Consulte seu saldo e acompanhe suas finanças de forma simples.
        </p>

        <footer class="rodape">Meu Banco • Controle financeiro</footer>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
